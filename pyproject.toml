[project]
name = "recall"
version = "0.1.0"
description = "Meeting memory for Microsoft Teams: transcripts, recaps, and a retrieval agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.60",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "fastembed>=0.3",
    "mcp>=1.2",
    "sse-starlette>=2.1",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "azure-monitor-opentelemetry>=1.6",
]
s3 = ["boto3>=1.34"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
recall = "recall.cli:main"
recall-mcp = "recall.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pgserver>=0.1.4",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]  # formatter owns line length

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pgvector.*", "fastembed.*", "docx.*", "faster_whisper.*", "boto3.*", "botocore.*",
    "azure.*", "sse_starlette.*", "pgserver.*", "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["eval: real-API evaluations (need ANTHROPIC_API_KEY)"]
addopts = "-m 'not eval'"
timeout = 120
